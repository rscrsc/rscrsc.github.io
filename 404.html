<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
</head>
<body>
  <h1>404 - Page Not Found</h1>
  <p>If you are seeing this, it means the page does not exist. You will be redirected...</p>
  <script>
    (function () {
      var DELAY = 2000;
      var path = window.location.pathname;
      var target;

      // If the URL ends with .html, try the clean URL instead
      if (/\.html$/.test(path)) {
        target = path.replace(/\.html$/, "");
      } else {
        target = "/";
      }

      window.setTimeout(function () {
        window.location.replace(target);
      }, DELAY);
    })();
  </script>
</body>
</html>
